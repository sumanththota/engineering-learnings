[project]
name = "engineering-learnings"
version = "0.1.0"
description = "Personal vault of engineering learnings, plus an MCP server for retrieval and write-back (spec 0002)."
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mcp_server"]
